[project]
name = "agrivision-poc"
version = "0.1.0"
description = "Minimal banana disease classification POC (dataset-swappable)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0.9",
    "pillow>=10.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "streamlit>=1.64",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false
